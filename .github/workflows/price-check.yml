name: Wholesale Price Check

on:
  schedule:
    # 8am and 8pm UK time. Cron runs in UTC and can't shift with UK clocks,
    # so these land exactly at 8am/8pm during GMT (late Oct - late Mar) and
    # drift an hour early, to 7am/7pm, during BST (late Mar - late Oct).
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress one finish
# rather than cancelling it (a scheduled run following close behind a
# manual one shouldn't clobber it mid-deploy).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run price check
        env:
          EUROLOTS_USERNAME: ${{ secrets.EUROLOTS_USERNAME }}
          EUROLOTS_PASSWORD: ${{ secrets.EUROLOTS_PASSWORD }}
          MERKANDI_USERNAME: ${{ secrets.MERKANDI_USERNAME }}
          MERKANDI_PASSWORD: ${{ secrets.MERKANDI_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python main.py

      # main.py writes site/index.html before it exits, even on a failed
      # run (a wholesaler failure just makes it exit non-zero afterwards),
      # so the dashboard should still get uploaded either way.
      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-dashboard:
    needs: check-prices
    # Deploy even if check-prices reported a failure (so the dashboard
    # shows *why* it failed) — just not if the run was cancelled outright.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
